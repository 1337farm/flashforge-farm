        uses: actions/cache/restore@v5
        with:
          path: engine/prusa30/jniImports/blosc
          key: prusa30-blosc-1.21.6-${{ hashFiles('scripts/build_prusa30_blosc.sh', 'scripts/build_prusa30_zstd.sh') }}-ndk${{ env.NDK_VERSION }}-${{ env.ABI }}
          fail-on-cache-miss: true

      - name: Restore staged OpenVDB 11.0.0 from cache
        id: vdb-cache
        uses: actions/cache/restore@v5
        with:
          path: engine/prusa30/jniImports/openvdb
          key: prusa30-openvdb-11.0.0-${{ hashFiles('scripts/build_prusa30_openvdb.sh', 'scripts/build_prusa30_blosc.sh', 'scripts/build_prusa30_zstd.sh') }}-ndk${{ env.NDK_VERSION }}-${{ env.ABI }}

      - name: Validate restored OpenVDB
        id: validate
        run: |
          NEED=1
