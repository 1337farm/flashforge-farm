  headless-build:
    name: headless
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    needs: [prusa30-changes, build-boost, build-tbb, build-nlopt, build-expat, build-pngfmt, build-assert, build-qhullmix, build-gmpcgal, build-openssl, build-zstd, build-blosc, build-openvdb, build-heatshrink, build-libbgcode, build-jpeg]
    if: needs.prusa30-changes.outputs.prusa30 == 'true'
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Android SDK env
        uses: 1337farm/actions/setup-android-env@v1
      - name: Install NDK ${{ env.NDK_VERSION }}
        uses: 1337farm/actions/setup-android-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
      - name: Install Android platform / CMake
        run: |
          sdkmanager "platforms;android-37.0" "cmake;3.22.1"
          ln -sfn "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37"

      - name: Fetch PrusaSlicer 3.0 source (pinned + patched)
        run: |
          chmod +x engine/prusa30/fetch_prusaslicer.sh
          PRUSA_REF="$PRUSA_REF" ./engine/prusa30/fetch_prusaslicer.sh

      - name: Stage header-only deps (cereal/json/spdlog/fmt/sol2/eigen)
        run: |
          chmod +x scripts/build_prusa30_deps.sh
          ./scripts/build_prusa30_deps.sh

      - name: Restore staged Boost ${{ env.BOOST_VER }} from cache
        id: boost-cache
        uses: actions/cache/restore@v5
        with:
          path: engine/prusa30/jniImports/boost
          key: prusa30-boost-${{ env.BOOST_VER }}-${{ hashFiles('scripts/build_boost.sh') }}-ndk${{ env.NDK_VERSION }}-${{ env.ABI }}
          fail-on-cache-miss: true

      - name: Validate staged Boost exactly
        run: |
          for lib in system filesystem thread regex chrono atomic date_time iostreams nowide; do
            ls "engine/prusa30/jniImports/boost/lib/$ABI/lib/libboost_${lib}"*.a >/dev/null \
              || { echo "ERROR: staged Boost missing libboost_$lib"; exit 1; }
          done
          grep -q "1_86" engine/prusa30/jniImports/boost/include/boost/version.hpp \
            || { echo "ERROR: staged Boost headers are not 1.86"; exit 1; }
          echo "--- actual staged archive names (FindBoost must match these) ---"
          ls engine/prusa30/jniImports/boost/lib/$ABI/lib/
          echo "Boost $BOOST_VER present and verified"

      - name: Bridge Boost archives into stage/lib (FindBoost search path)
        run: |
          # FindBoost probes <prefix>/stage/lib for BOOST_ROOT layouts; our
          # NDK archives live one level deeper (lib/<abi>/lib, Orca layout).
          # Relative symlinks keep working whatever the runner workspace is.
          mkdir -p engine/prusa30/jniImports/boost/stage/lib
          for a in engine/prusa30/jniImports/boost/lib/$ABI/lib/libboost_*.a; do
            ln -sf "../../lib/$ABI/lib/$(basename "$a")" \
              "engine/prusa30/jniImports/boost/stage/lib/$(basename "$a")"
          done
          ls engine/prusa30/jniImports/boost/stage/lib/ | head -5

      - name: Restore staged oneTBB v2021.12.0 from cache
        uses: actions/cache/restore@v5
        with:
          path: engine/prusa30/jniImports/tbb
          key: prusa30-tbb-v2021.12.0-${{ hashFiles('scripts/build_prusa30_tbb.sh') }}-ndk${{ env.NDK_VERSION }}-${{ env.ABI }}
          fail-on-cache-miss: true

      - name: Validate staged oneTBB exactly
        run: |
          test -f engine/prusa30/jniImports/tbb/include/oneapi/tbb/version.h \
            || { echo "ERROR: staged oneTBB missing oneapi headers"; exit 1; }
          find engine/prusa30/jniImports/tbb -name TBBConfig.cmake | grep -q . \
            || { echo "ERROR: staged oneTBB missing TBBConfig.cmake"; exit 1; }
          echo "oneTBB v2021.12.0 present and verified"

      - name: Restore staged NLopt v2.5.0 from cache
        uses: actions/cache/restore@v5
        with:
          path: engine/prusa30/jniImports/nlopt
          key: prusa30-nlopt-v2.5.0-${{ hashFiles('scripts/build_prusa30_nlopt.sh') }}-ndk${{ env.NDK_VERSION }}-${{ env.ABI }}
          fail-on-cache-miss: true

      - name: Validate staged NLopt exactly
        run: |
          test -f engine/prusa30/jniImports/nlopt/include/nlopt.hpp \
            || { echo "ERROR: staged NLopt missing nlopt.hpp"; exit 1; }
          ls engine/prusa30/jniImports/nlopt/lib/libnlopt_cxx.* >/dev/null \
            || { echo "ERROR: staged NLopt missing libnlopt_cxx"; exit 1; }
          echo "NLopt v2.5.0 present and verified"

      - name: Restore staged expat R_2_8_2 from cache
        uses: actions/cache/restore@v5
        with:
          path: engine/prusa30/jniImports/expat
          key: prusa30-expat-R_2_8_2-${{ hashFiles('scripts/build_prusa30_expat.sh') }}-ndk${{ env.NDK_VERSION }}-${{ env.ABI }}
          fail-on-cache-miss: true

      - name: Validate staged expat exactly
        run: |
          test -f engine/prusa30/jniImports/expat/include/expat.h \
            || { echo "ERROR: staged expat missing expat.h"; exit 1; }
          find engine/prusa30/jniImports/expat -name 'libexpat.a' | grep -q . \
            || { echo "ERROR: staged expat missing libexpat.a"; exit 1; }
          find engine/prusa30/jniImports/expat -name 'expat-config.cmake' | grep -q . \
            || { echo "ERROR: staged expat missing expat-config.cmake"; exit 1; }
          echo "expat R_2_8_2 present and verified"

      - name: Restore staged pngfmt from cache
        uses: actions/cache/restore@v5
        with:
          path: engine/prusa30/jniImports/pngfmt
          key: prusa30-pngfmt-${{ hashFiles('scripts/build_prusa30_png.sh', 'scripts/build_prusa30_fmt.sh', 'scripts/build_prusa30_tracy.sh') }}-ndk${{ env.NDK_VERSION }}-${{ env.ABI }}
          fail-on-cache-miss: true

      - name: Validate staged pngfmt exactly
        run: |
          test -f engine/prusa30/jniImports/pngfmt/include/zlib.h \
            || { echo "ERROR: staged zlib.h missing"; exit 1; }
          test -f engine/prusa30/jniImports/pngfmt/include/png.h \
            || { echo "ERROR: staged png.h missing"; exit 1; }
