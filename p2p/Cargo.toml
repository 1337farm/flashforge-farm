[package]
name = "farm-iroh"
version = "0.1.0"
edition = "2021"
description = "Custom UniFFI binding: iroh endpoint for FlashForge Farm (Android arm64). Built from source in-repo; no prebuilt FFI."
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]
name = "farm_iroh"

[dependencies]
iroh = "=1.1.0"
iroh-base = "=1.1.0"
iroh-blobs = { version = "=0.103.0", features = ["fs-store"] }
iroh-tickets = "=1.0.0"
bytes = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
futures-util = "0.3"
uniffi = "0.32"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
uniffi = { version = "0.32", features = ["build"] }
