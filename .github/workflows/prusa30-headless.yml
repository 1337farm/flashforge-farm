            test -f engine/prusa30/jniImports/gmpcgal/include/gmpxx.h || OK=0
            test -f engine/prusa30/jniImports/gmpcgal/include/mpfr.h || OK=0
            ls engine/prusa30/jniImports/gmpcgal/lib/libgmp.so >/dev/null 2>&1 || OK=0
            ls engine/prusa30/jniImports/gmpcgal/lib/libgmpxx.so >/dev/null 2>&1 || OK=0
            ls engine/prusa30/jniImports/gmpcgal/lib/libmpfr.so >/dev/null 2>&1 || OK=0
            find engine/prusa30/jniImports/gmpcgal \( -name 'CGALConfig.cmake' -o -name 'CGAL-config.cmake' \) | grep -q . || OK=0
            [ "$OK" = "1" ] && NEED=0
          fi
