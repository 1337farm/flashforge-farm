      - name: Configure headless 3.0 build (arm64-v8a)
        env:
          # Upstream FindNLopt reads the NLOPT *environment* variable:
          # $NLOPT/include/nlopt.hpp + $NLOPT/lib/libnlopt_cxx.
          NLOPT: ${{ github.workspace }}/engine/prusa30/jniImports/nlopt
        run: |
          # Configure upstream as the TOP-LEVEL project: its root CMakeLists
          # relies on CMAKE_SOURCE_DIR/module-path being the upstream tree.
          # TBB's config dir varies by install layout (lib/cmake/TBB vs
          # lib/<triplet>/cmake/TBB); resolve it instead of guessing.
          TBB_CMAKE_DIR="$(find "$(pwd)/engine/prusa30/jniImports/tbb" -name TBBConfig.cmake -printf '%h\n' | head -1)"
          test -n "$TBB_CMAKE_DIR" || { echo "ERROR: TBBConfig.cmake not staged"; exit 1; }
          echo "TBB config dir: $TBB_CMAKE_DIR"
          # Same for expat: its CONFIG file may sit at lib/cmake/expat or
          # lib/<triplet>/cmake/expat. Upstream FindEXPAT passes EXPAT_DIR
          # into find_package(EXPAT CONFIG), so give it the exact dir.
          EXPAT_CMAKE_DIR="$(find "$(pwd)/engine/prusa30/jniImports/expat" -name expat-config.cmake -printf '%h\n' | head -1)"
          test -n "$EXPAT_CMAKE_DIR" || { echo "ERROR: expat-config.cmake not staged"; exit 1; }
          echo "EXPAT config dir: $EXPAT_CMAKE_DIR"
          # Same for cereal: the staged tree carries a minimal CONFIG package
          # (the header-fallback bakes a source-relative include dir that
          # never resolves for staged headers).
          CEREAL_CMAKE_DIR="$(find "$(pwd)/engine/prusa30/jniImports/cereal" -name cereal-config.cmake -printf '%h\n' | head -1)"
          test -n "$CEREAL_CMAKE_DIR" || { echo "ERROR: cereal-config.cmake not staged"; exit 1; }
          echo "cereal config dir: $CEREAL_CMAKE_DIR"
          # Same for Eigen3: bundled find_package(Eigen3) is CONFIG-only.
          EIGEN_CMAKE_DIR="$(find "$(pwd)/engine/prusa30/jniImports/eigen" -name Eigen3Config.cmake -printf '%h\n' | head -1)"
          test -n "$EIGEN_CMAKE_DIR" || { echo "ERROR: Eigen3Config.cmake not staged"; exit 1; }
          echo "Eigen3 config dir: $EIGEN_CMAKE_DIR"
          # Same for tl-expected (slic3r-base links tl::expected).
          EXPECTED_CMAKE_DIR="$(find "$(pwd)/engine/prusa30/jniImports/expected" -name tl-expected-config.cmake -printf '%h\n' | head -1)"
          test -n "$EXPECTED_CMAKE_DIR" || { echo "ERROR: tl-expected-config.cmake not staged"; exit 1; }
          echo "tl-expected config dir: $EXPECTED_CMAKE_DIR"
          # Same for NanoSVG (header-only nanosvg + nanosvgrast targets).
          NANOSVG_CMAKE_DIR="$(find "$(pwd)/engine/prusa30/jniImports/nanosvg" -name NanoSVGConfig.cmake -printf '%h\n' | head -1)"
          test -n "$NANOSVG_CMAKE_DIR" || { echo "ERROR: NanoSVGConfig.cmake not staged"; exit 1; }
          echo "NanoSVG config dir: $NANOSVG_CMAKE_DIR"
          # Qhull + mixer live in sibling prefixes; resolve either Qhull
          # config-file casing (year-2000 CMake names vary by version).
          QHULL_CMAKE_DIR="$(find "$(pwd)/engine/prusa30/jniImports/qhull" \( -name QhullConfig.cmake -o -name qhull-config.cmake \) -printf '%h\n' | head -1)"
          test -n "$QHULL_CMAKE_DIR" || { echo "ERROR: Qhull config not staged"; exit 1; }
          echo "Qhull config dir: $QHULL_CMAKE_DIR"
          MIXER_CMAKE_DIR="$(find "$(pwd)/engine/prusa30/jniImports/mixer" \( -name prusa_fdm_mixerConfig.cmake -o -name prusa_fdm_mixer-config.cmake \) -printf '%h\n' | head -1)"
          test -n "$MIXER_CMAKE_DIR" || { echo "ERROR: mixer config not staged"; exit 1; }
          echo "mixer config dir: $MIXER_CMAKE_DIR"
          # Same for libassert: resolve whichever config name its install used.
          ASSERT_CMAKE_DIR="$(find "$(pwd)/engine/prusa30/jniImports/assert" \( -name libassert-config.cmake -o -name libassertConfig.cmake \) -printf '%h\n' | head -1)"
          test -n "$ASSERT_CMAKE_DIR" || { echo "ERROR: libassert config not staged"; exit 1; }
          echo "libassert config dir: $ASSERT_CMAKE_DIR"
          # libassert's config find_dependency()s cpptrace, which lives in
          # the same stage tree but off CMAKE_PREFIX_PATH — resolve it too.
          CPPTRACE_CMAKE_DIR="$(find "$(pwd)/engine/prusa30/jniImports/assert" -name cpptrace-config.cmake -printf '%h\n' | head -1)"
          test -n "$CPPTRACE_CMAKE_DIR" || { echo "ERROR: cpptrace-config.cmake not staged"; exit 1; }
          echo "cpptrace config dir: $CPPTRACE_CMAKE_DIR"
          # Same for fmt: fmt 12.x no longer ships a Find module, only
          # fmt-config.cmake — resolve it exactly the same way.
          FMT_CMAKE_DIR="$(find "$(pwd)/engine/prusa30/jniImports/pngfmt" -name fmt-config.cmake -printf '%h\n' | head -1)"
          test -n "$FMT_CMAKE_DIR" || { echo "ERROR: fmt-config.cmake not staged"; exit 1; }
          echo "fmt config dir: $FMT_CMAKE_DIR"
          # Same for spdlog (header-only shim exposing spdlog::spdlog).
          SPDLOG_CMAKE_DIR="$(find "$(pwd)/engine/prusa30/jniImports/spdlog" -name spdlogConfig.cmake -printf '%h\n' | head -1)"
          test -n "$SPDLOG_CMAKE_DIR" || { echo "ERROR: spdlogConfig.cmake not staged"; exit 1; }
          echo "spdlog config dir: $SPDLOG_CMAKE_DIR"
          # Tracy: slic3r_add_tracy needs target Tracy::TracyClient with an
          # INTERFACE_INCLUDE_DIRECTORIES property even when profiling is OFF
          # (sources only get compiled with SLIC3R_ENABLE_PROFILING=ON, off by
          # default). The staged TracyConfig.cmake provides exactly that
          # imported target; resolve its dir like the other CONFIG packages.
          TRACY_CMAKE_DIR="$(find "$(pwd)/engine/prusa30/jniImports/pngfmt" -name TracyConfig.cmake -printf '%h\n' | head -1)"
          test -n "$TRACY_CMAKE_DIR" || { echo "ERROR: TracyConfig.cmake not staged"; exit 1; }
          echo "Tracy config dir: $TRACY_CMAKE_DIR"
          # Same for CGAL: the gmpcgal prefix carries CGALConfig.cmake from
          # CGAL's own `cmake --install` tree (year-2000 CMake names vary by
          # version, so resolve either casing like Qhull).
          CGAL_CMAKE_DIR="$(find "$(pwd)/engine/prusa30/jniImports/gmpcgal" \( -name CGALConfig.cmake -o -name CGAL-config.cmake \) -printf '%h\n' | head -1)"
          test -n "$CGAL_CMAKE_DIR" || { echo "ERROR: CGALConfig.cmake not staged"; exit 1; }
          echo "CGAL config dir: $CGAL_CMAKE_DIR"
          # CGAL's config re-probes GMP/MPFR via its own FindGMP/FindMPFR at
          # OUR configure time: pre-seed the exact staged libs+headers (same
          # PNG/ZLIB pattern) so no NDK-sysroot probing is needed.
          # NDK quirk (playbook section 5): the toolchain forces
          # CMAKE_FIND_ROOT_PATH_MODE_*=ONLY, so absolute HINTS get re-rooted
          # under the sysroot and staged-prefix header finds miss. Top-level
          # calls never notice (-DBoost_INCLUDE_DIR cache-hits), but CGAL's
          # tweak changes Boost_ADDITIONAL_VERSIONS, invalidating the cache
          # and forcing a re-search that misses. BOTH searches re-rooted
          # first, then original paths: strictly more than ONLY, so existing
          # exact pre-seeds (PNG/ZLIB/GMP/MPFR/_DIRs) resolve identically.
          GMP_INC="$(dirname "$(find "$(pwd)/engine/prusa30/jniImports/gmpcgal" -name gmp.h | head -1)")"
          test -n "$GMP_INC" || { echo "ERROR: staged gmp.h not found"; exit 1; }
          GMP_LIB="$(find "$(pwd)/engine/prusa30/jniImports/gmpcgal" -name 'libgmp.so' | head -1)"
          test -n "$GMP_LIB" || { echo "ERROR: staged libgmp.so not found"; exit 1; }
          GMPXX_LIB="$(find "$(pwd)/engine/prusa30/jniImports/gmpcgal" -name 'libgmpxx.so' | head -1)"
          test -n "$GMPXX_LIB" || { echo "ERROR: staged libgmpxx.so not found"; exit 1; }
          MPFR_LIB="$(find "$(pwd)/engine/prusa30/jniImports/gmpcgal" -name 'libmpfr.so' | head -1)"
          test -n "$MPFR_LIB" || { echo "ERROR: staged libmpfr.so not found"; exit 1; }
          echo "GMP lib: $GMP_LIB inc: $GMP_INC"
          echo "MPFR lib: $MPFR_LIB"
          # PNG/ZLIB: stock FindPNG/FindZLIB honor PNG_ROOT/ZLIB_ROOT, but
          # pre-seeding the exact lib+include paths is immune to GNUInstallDirs
          # nesting (lib/ vs lib/<triplet>/) and NDK-sysroot shadowing
          # (configure once grabbed sysroot libz.so 1.2.11 over staged 1.3.1).
          PNG_LIB="$(find "$(pwd)/engine/prusa30/jniImports/pngfmt" -name 'libpng16.a' -o -name 'libpng.a' | head -1)"
          test -n "$PNG_LIB" || { echo "ERROR: staged libpng not found"; exit 1; }
          PNG_INC="$(dirname "$(find "$(pwd)/engine/prusa30/jniImports/pngfmt" -name png.h | head -1)")"
          test -n "$PNG_INC" || { echo "ERROR: staged png.h not found"; exit 1; }
          echo "PNG lib: $PNG_LIB inc: $PNG_INC"
          ZLIB_LIB="$(find "$(pwd)/engine/prusa30/jniImports/pngfmt" -name 'libz.a' | head -1)"
          test -n "$ZLIB_LIB" || { echo "ERROR: staged libz.a not found"; exit 1; }
          ZLIB_INC="$(dirname "$(find "$(pwd)/engine/prusa30/jniImports/pngfmt" -name zlib.h | head -1)")"
          test -n "$ZLIB_INC" || { echo "ERROR: staged zlib.h not found"; exit 1; }
          echo "ZLIB lib: $ZLIB_LIB inc: $ZLIB_INC"
          # libslic3r find_package(JPEG) uses stock FindJPEG (module mode):
          # pre-seed the exact staged lib+include (PNG/ZLIB/OpenSSL pattern)
          # so NDK MODE=ONLY re-rooting can't shadow it with a sysroot stub.
          JPEG_LIB="$(find "$(pwd)/engine/prusa30/jniImports/jpeg" -name 'libjpeg.a' | head -1)"
          test -n "$JPEG_LIB" || { echo "ERROR: staged libjpeg.a not found"; exit 1; }
          JPEG_INC="$(dirname "$(find "$(pwd)/engine/prusa30/jniImports/jpeg" -name jpeglib.h | head -1)")"
          test -n "$JPEG_INC" || { echo "ERROR: staged jpeglib.h not found"; exit 1; }
          echo "JPEG lib: $JPEG_LIB inc: $JPEG_INC"
          # OpenSSL: slic3r-biz-crypto hard-requires find_package(OpenSSL).
          # Pre-seed the exact staged libs+include (PNG/ZLIB pattern) so the
          # NDK MODE=ONLY re-rooting (playbook §5) can't shadow them with the
          # sysroot's header-only 3.0.13 tree.
          OPENSSL_ROOT="$(pwd)/engine/prusa30/jniImports/openssl"
          test -f "$OPENSSL_ROOT/include/openssl/ssl.h" \
            || { echo "ERROR: staged ssl.h missing"; exit 1; }
          OPENSSL_INCLUDE_DIR="$OPENSSL_ROOT/include"
          OPENSSL_CRYPTO_LIBRARY="$OPENSSL_ROOT/lib/libcrypto.a"
          test -f "$OPENSSL_CRYPTO_LIBRARY" \
            || { echo "ERROR: staged libcrypto.a missing"; exit 1; }
          OPENSSL_SSL_LIBRARY="$OPENSSL_ROOT/lib/libssl.a"
          test -f "$OPENSSL_SSL_LIBRARY" \
            || { echo "ERROR: staged libssl.a missing"; exit 1; }
          echo "OpenSSL libcrypto: $OPENSSL_CRYPTO_LIBRARY inc: $OPENSSL_INCLUDE_DIR"
          # OpenVDB: bundled FindOpenVDB (src/libslic3r) reads the staged
          # openvdb/version.h (USE_BLOSC/ZLIB baked in) then hard-requires
          # Blosc{+zstd config}, ZLIB, TBB and Boost iostreams — all staged.
          # Pre-seed the exact component vars so the NDK MODE=ONLY re-rooting
          # (playbook §5) can't miss them (same PNG/ZLIB/OpenSSL pattern).
          OPENVDB_STAGE="$(pwd)/engine/prusa30/jniImports/openvdb"
          test -f "$OPENVDB_STAGE/include/openvdb/version.h" \
            || { echo "ERROR: staged openvdb/version.h missing"; exit 1; }
          OPENVDB_INC="$(dirname "$(find "$OPENVDB_STAGE" -path '*/openvdb/version.h' | head -1)")"
          OPENVDB_LIB="$(find "$OPENVDB_STAGE" -name 'libopenvdb.a' | head -1)"
          test -n "$OPENVDB_LIB" || { echo "ERROR: staged libopenvdb.a missing"; exit 1; }
          grep -q "OPENVDB_USE_BLOSC" "$OPENVDB_STAGE/include/openvdb/version.h" \
            || { echo "ERROR: staged openvdb lacks OPENVDB_USE_BLOSC"; exit 1; }
          echo "OpenVDB lib: $OPENVDB_LIB inc: $OPENVDB_INC"
          BLOSC_INC="$(dirname "$(find "$(pwd)/engine/prusa30/jniImports/blosc" -name blosc.h | head -1)")"
          test -n "$BLOSC_INC" || { echo "ERROR: staged blosc.h missing"; exit 1; }
          BLOSC_LIB="$(find "$(pwd)/engine/prusa30/jniImports/blosc" -name 'libblosc.a' | head -1)"
          test -n "$BLOSC_LIB" || { echo "ERROR: staged libblosc.a missing"; exit 1; }
          echo "Blosc lib: $BLOSC_LIB inc: $BLOSC_INC"
          # Blosc::blosc unconditionally links zstd::libzstd via
          # find_package(zstd REQUIRED) (config mode) — resolve its package dir.
          ZSTD_CMAKE_DIR="$(find "$(pwd)/engine/prusa30/jniImports/zstd" -name zstdConfig.cmake -printf '%h\n' | head -1)"
          test -n "$ZSTD_CMAKE_DIR" || { echo "ERROR: staged zstdConfig.cmake missing"; exit 1; }
          test -f "$ZSTD_CMAKE_DIR/zstdTargets.cmake" \
            || { echo "ERROR: zstdTargets.cmake missing"; exit 1; }
          grep -q "zstd::libzstd" "$ZSTD_CMAKE_DIR/zstdTargets.cmake" \
            || { echo "ERROR: zstd::libzstd target missing"; exit 1; }
          echo "zstd config dir: $ZSTD_CMAKE_DIR"
          # LibBGCode: find_package(LibBGCode REQUIRED COMPONENTS Convert)
          # resolves via our staged config package. Its Config.cmake.in
          # find_dependency()s heatshrink/ZLIB/Boost at OUR configure time
          # (Binarize -> heatshrink 0.4 + ZLIB 1.0; Convert -> Boost 1.78), so
          # heatshrink needs the exact config dir too (same TBB/EXPAT pattern).
          # ZLIB + Boost are already pre-seeded below/above.
          HEATSHRINK_CMAKE_DIR="$(find "$(pwd)/engine/prusa30/jniImports/heatshrink" -name heatshrinkConfig.cmake -printf '%h\n' | head -1)"
          test -n "$HEATSHRINK_CMAKE_DIR" || { echo "ERROR: heatshrinkConfig.cmake not staged"; exit 1; }
          echo "heatshrink config dir: $HEATSHRINK_CMAKE_DIR"
          BGCODE_CMAKE_DIR="$(find "$(pwd)/engine/prusa30/jniImports/bgcode" -name LibBGCodeConfig.cmake -printf '%h\n' | head -1)"
          test -n "$BGCODE_CMAKE_DIR" || { echo "ERROR: LibBGCodeConfig.cmake not staged"; exit 1; }
          echo "LibBGCode config dir: $BGCODE_CMAKE_DIR"
          cmake -S "$(pwd)/engine/build/prusaslicer-src" -B build/prusa30 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_STL=c++_shared \
            -DANDROID_PLATFORM=android-23 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DSLIC3R_GUI=OFF \
            -DSLIC3R_BUILD_TESTS=OFF \
            -DCMAKE_PREFIX_PATH="$(pwd)/engine/prusa30/jniImports" \
            -DBOOST_ROOT="$(pwd)/engine/prusa30/jniImports/boost" \
            -DBoost_ROOT="$(pwd)/engine/prusa30/jniImports/boost" \
            -DBoost_INCLUDE_DIR="$(pwd)/engine/prusa30/jniImports/boost/include" \
            -DBoost_LIBRARY_DIR="$(pwd)/engine/prusa30/jniImports/boost/lib/arm64-v8a/lib" \
            -DBoost_ARCHITECTURE="-a64" \
            -DBoost_COMPILER="-clang" \
            -DBOOST_INCLUDEDIR="$(pwd)/engine/prusa30/jniImports/boost/include" \
            -DBOOST_LIBRARYDIR="$(pwd)/engine/prusa30/jniImports/boost/lib/arm64-v8a/lib" \
            -DTBB_DIR="$TBB_CMAKE_DIR" \
            -DEXPAT_DIR="$EXPAT_CMAKE_DIR" \
            -Dfmt_DIR="$FMT_CMAKE_DIR" \
            -Dlibassert_DIR="$ASSERT_CMAKE_DIR" \
            -DQhull_DIR="$QHULL_CMAKE_DIR" \
            -Dprusa_fdm_mixer_DIR="$MIXER_CMAKE_DIR" \
            -DCGAL_DIR="$CGAL_CMAKE_DIR" \
            -DGMP_INCLUDE_DIR="$GMP_INC" \
            -DGMP_LIBRARIES="$GMP_LIB" \
            -DGMPXX_INCLUDE_DIR="$GMP_INC" \
            -DGMPXX_LIBRARIES="$GMPXX_LIB" \
            -DMPFR_INCLUDE_DIR="$GMP_INC" \
            -DMPFR_LIBRARIES="$MPFR_LIB" \
            -Dcpptrace_DIR="$CPPTRACE_CMAKE_DIR" \
            -Dspdlog_DIR="$SPDLOG_CMAKE_DIR" \
            -Dcereal_DIR="$CEREAL_CMAKE_DIR" \
            -DEigen3_DIR="$EIGEN_CMAKE_DIR" \
            -Dtl-expected_DIR="$EXPECTED_CMAKE_DIR" \
            -DNanoSVG_DIR="$NANOSVG_CMAKE_DIR" \
            -DZLIB_ROOT="$(pwd)/engine/prusa30/jniImports/pngfmt" \
            -DPNG_ROOT="$(pwd)/engine/prusa30/jniImports/pngfmt" \
            -DZLIB_LIBRARY="$ZLIB_LIB" \
            -DZLIB_INCLUDE_DIR="$ZLIB_INC" \
            -DPNG_LIBRARY="$PNG_LIB" \
            -DPNG_PNG_INCLUDE_DIR="$PNG_INC" \
            -DTracy_DIR="$TRACY_CMAKE_DIR" \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT" \
            -DOPENSSL_INCLUDE_DIR="$OPENSSL_INCLUDE_DIR" \
            -DOPENSSL_CRYPTO_LIBRARY="$OPENSSL_CRYPTO_LIBRARY" \
            -DOPENSSL_SSL_LIBRARY="$OPENSSL_SSL_LIBRARY" \
            -DOPENVDB_USE_STATIC_LIBS=ON \
            -DOpenVDB_ROOT="$OPENVDB_STAGE" \
            -DOpenVDB_INCLUDE_DIR="$OPENVDB_INC" \
            -DOpenVDB_openvdb_INCLUDE_DIR="$OPENVDB_INC" \
            -DOpenVDB_openvdb_LIBRARY="$OPENVDB_LIB" \
            -DBLOSC_USE_STATIC_LIBS=ON \
            -DBlosc_ROOT="$(pwd)/engine/prusa30/jniImports/blosc" \
            -DBlosc_INCLUDE_DIR="$BLOSC_INC" \
            -DBlosc_LIBRARY="$BLOSC_LIB" \
            -DBlosc_LIBRARY_RELEASE="$BLOSC_LIB" \
            -Dzstd_DIR="$ZSTD_CMAKE_DIR" \
            -Dheatshrink_DIR="$HEATSHRINK_CMAKE_DIR" \
            -DLibBGCode_DIR="$BGCODE_CMAKE_DIR" \
            -DJPEG_LIBRARY="$JPEG_LIB" \
            -DJPEG_INCLUDE_DIR="$JPEG_INC"

      - name: Build headless core (libslic3r)
        run: |
          cmake --build build/prusa30 --target libslic3r -j"$(nproc)"

  # Terminal gate: this is the ONE prusa30 check branch protection/ruleset must
  # require, instead of every individual stage name. GitHub never auto-adds new
  # job names to required checks, so a per-job list silently goes stale when a
  # dep stage is added (2026-09-13: #204 merged red — headless failed on Blosc
  # but only native engine/apk were required, and automerge ignored the red
  # headless check). The gate `needs:` EVERY stage and fails unless each
  # upstream result is success (skips are only OK on the prusa30=false change
  # path). Adding a job to this workflow only requires adding it to this gate's
  # needs+check — enforcement stays exactly one name.
  prusa30-gate:
    name: prusa30-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs:
      - prusa30-changes
      - build-boost
      - build-tbb
      - build-nlopt
      - build-expat
      - build-pngfmt
      - build-assert
      - build-qhullmix
      - build-gmpcgal
      - build-openssl
      - build-zstd
      - build-blosc
      - build-openvdb
      - build-heatshrink
      - build-libbgcode
      - build-jpeg
      - headless-build
    steps:
      - name: Gate every prusa30 stage result
        run: |
          NEED="${{ needs.prusa30-changes.outputs.prusa30 }}"
          if [ "$NEED" != "true" ]; then
            echo "prusa30 untouched: heavy stages skipped by design; gate green"
            exit 0
          fi
          BAD=""
          for kv in \
            "boost=${{ needs.build-boost.result }}" \
            "tbb=${{ needs.build-tbb.result }}" \
            "nlopt=${{ needs.build-nlopt.result }}" \
            "expat=${{ needs.build-expat.result }}" \
            "pngfmt=${{ needs.build-pngfmt.result }}" \
            "assert=${{ needs.build-assert.result }}" \
            "qhullmix=${{ needs.build-qhullmix.result }}" \
            "gmpcgal=${{ needs.build-gmpcgal.result }}" \
            "openssl=${{ needs.build-openssl.result }}" \
            "zstd=${{ needs.build-zstd.result }}" \
            "blosc=${{ needs.build-blosc.result }}" \
            "openvdb=${{ needs.build-openvdb.result }}" \
            "heatshrink=${{ needs.build-heatshrink.result }}" \
            "libbgcode=${{ needs.build-libbgcode.result }}" \
            "jpeg=${{ needs.build-jpeg.result }}" \
            "headless=${{ needs.headless-build.result }}" \
          ; do
            name="${kv%%=*}"; res="${kv#*=}"
            [ "$res" = "success" ] || BAD="$BAD $name=$res"
          done
          if [ -n "$BAD" ]; then
            echo "ERROR: prusa30 pipeline red:$BAD"
            exit 1
          fi
          echo "prusa30 pipeline fully green (all 16 stages success)"