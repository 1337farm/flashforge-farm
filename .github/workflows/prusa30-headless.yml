name: prusa30-headless

# Compile-fix loop for the Orca -> PrusaSlicer 3.0 swap. Fetches the pinned
# upstream tree, applies our headless patch, then configures/builds
# engine/prusa30 against the Android NDK. Isolated from native-engine-build.yml
# (which still builds the Orca engine) so the 3.0 bring-up does not break the
# shipping app. A red run IS the error list that drives the next fix PR.

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - "engine/prusa30/**"
      - "scripts/build_boost.sh"
      - "scripts/build_prusa30_tbb.sh"
      - "scripts/build_prusa30_nlopt.sh"
      - "scripts/build_prusa30_libassert.sh"
      - "scripts/build_prusa30_expat.sh"
      - "scripts/build_prusa30_png.sh"
      - "scripts/build_prusa30_fmt.sh"
      - "scripts/build_prusa30_tracy.sh"
      - ".github/workflows/prusa30-headless.yml"
  pull_request:
    paths:
      - "engine/prusa30/**"
      - "scripts/build_boost.sh"
      - "scripts/build_prusa30_tbb.sh"
      - "scripts/build_prusa30_nlopt.sh"
      - "scripts/build_prusa30_libassert.sh"
      - "scripts/build_prusa30_expat.sh"
      - "scripts/build_prusa30_png.sh"
      - "scripts/build_prusa30_fmt.sh"
      - "scripts/build_prusa30_tracy.sh"
      - ".github/workflows/prusa30-headless.yml"

env:
  NDK_VERSION: "23.1.7779620"
  PRUSA_REF: "6f510128d7c2e543b62919b74bea7e876f564205"
  BOOST_VER: "1.86.0"
  ABI: "arm64-v8a"

jobs:
  build-boost:
    name: boost
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Restore staged Boost ${{ env.BOOST_VER }} from cache
        id: boost-cache
        uses: actions/cache/restore@v5
        with:
          path: engine/prusa30/jniImports/boost
          key: prusa30-boost-${{ env.BOOST_VER }}-${{ hashFiles('scripts/build_boost.sh') }}-ndk${{ env.NDK_VERSION }}-${{ env.ABI }}

      - name: Validate restored Boost
        id: validate
        run: |
          NEED=1
          if [ "${{ steps.boost-cache.outputs.cache-hit }}" = "true" ]; then
            OK=1
            for lib in system filesystem thread regex chrono atomic date_time iostreams nowide; do
              ls "engine/prusa30/jniImports/boost/lib/$ABI/lib/libboost_${lib}"*.a >/dev/null 2>&1 || OK=0
            done
            grep -q "1_86" engine/prusa30/jniImports/boost/include/boost/version.hpp 2>/dev/null || OK=0
            [ "$OK" = "1" ] && NEED=0
          fi
          echo "need=$NEED" >> "$GITHUB_OUTPUT"

      - name: Set up Android SDK env
        if: steps.validate.outputs.need == '1'
        uses: 1337farm/actions/setup-android-env@v1
      - name: Install NDK ${{ env.NDK_VERSION }}
        if: steps.validate.outputs.need == '1'
        uses: 1337farm/actions/setup-android-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
      - name: Install Android platform / CMake
        if: steps.validate.outputs.need == '1'
        run: |
          sdkmanager "platforms;android-37.0" "cmake;3.22.1"
          ln -sfn "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37"

      - name: Build Boost ${{ env.BOOST_VER }} from source (FULL)
        if: steps.validate.outputs.need == '1'
        run: |
          chmod +x scripts/build_boost.sh
          BOOST_VER="$BOOST_VER" ABI="$ABI" API_LEVEL="23" \
            JNI_IMPORTS_DIR="$(pwd)/engine/prusa30/jniImports" \
            ./scripts/build_boost.sh

      - name: Verify staged Boost exactly
        if: steps.validate.outputs.need == '1'
        run: |
          for lib in system filesystem thread regex chrono atomic date_time iostreams nowide; do
            ls "engine/prusa30/jniImports/boost/lib/$ABI/lib/libboost_${lib}"*.a >/dev/null \
              || { echo "ERROR: missing libboost_$lib archive"; exit 1; }
          done
          grep -q "1_86" engine/prusa30/jniImports/boost/include/boost/version.hpp \
            || { echo "ERROR: staged headers are not Boost 1.86"; exit 1; }
          echo "Boost $BOOST_VER staged and verified"

      - name: Save staged Boost ${{ env.BOOST_VER }}
        if: steps.validate.outputs.need == '1'
        uses: actions/cache/save@v5
        with:
          path: engine/prusa30/jniImports/boost
          key: prusa30-boost-${{ env.BOOST_VER }}-${{ hashFiles('scripts/build_boost.sh') }}-ndk${{ env.NDK_VERSION }}-${{ env.ABI }}

  build-tbb:
    name: tbb
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Restore staged oneTBB v2021.12.0 from cache
        id: tbb-cache
        uses: actions/cache/restore@v5
        with:
          path: engine/prusa30/jniImports/tbb
          key: prusa30-tbb-v2021.12.0-${{ hashFiles('scripts/build_prusa30_tbb.sh') }}-ndk${{ env.NDK_VERSION }}-${{ env.ABI }}

      - name: Validate restored oneTBB
        id: validate
        run: |
          NEED=1
          if [ "${{ steps.tbb-cache.outputs.cache-hit }}" = "true" ]; then
            OK=1
            test -f engine/prusa30/jniImports/tbb/include/oneapi/tbb/version.h || OK=0
            ls engine/prusa30/jniImports/tbb/lib*/cmake/TBB/TBBConfig.cmake >/dev/null 2>&1 \
              || find engine/prusa30/jniImports/tbb -name TBBConfig.cmake | grep -q . || OK=0
            find engine/prusa30/jniImports/tbb -name 'libtbb.a' | grep -q . || OK=0
            [ "$OK" = "1" ] && NEED=0
          fi
          echo "need=$NEED" >> "$GITHUB_OUTPUT"

      - name: Set up Android SDK env
        if: steps.validate.outputs.need == '1'
        uses: 1337farm/actions/setup-android-env@v1
      - name: Install NDK ${{ env.NDK_VERSION }}
        if: steps.validate.outputs.need == '1'
        uses: 1337farm/actions/setup-android-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
      - name: Install Android platform / CMake
        if: steps.validate.outputs.need == '1'
        run: |
          sdkmanager "platforms;android-37.0" "cmake;3.22.1"
          ln -sfn "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37"

      - name: Build oneTBB v2021.12.0 from source (static)
        if: steps.validate.outputs.need == '1'
        run: |
          chmod +x scripts/build_prusa30_tbb.sh
          ABI="$ABI" API_LEVEL="23" \
            STAGE_ROOT="$(pwd)/engine/prusa30/jniImports/tbb" \
            ./scripts/build_prusa30_tbb.sh

      - name: Verify staged oneTBB exactly
        if: steps.validate.outputs.need == '1'
        run: |
          test -f engine/prusa30/jniImports/tbb/include/oneapi/tbb/version.h \
            || { echo "ERROR: oneapi/tbb/version.h missing"; exit 1; }
          find engine/prusa30/jniImports/tbb -name TBBConfig.cmake | grep -q . \
            || { echo "ERROR: TBBConfig.cmake missing"; exit 1; }
          find engine/prusa30/jniImports/tbb -name 'libtbb.a' | grep -q . \
            || { echo "ERROR: no libtbb.a staged"; exit 1; }
          echo "oneTBB v2021.12.0 staged and verified"

      - name: Save staged oneTBB v2021.12.0
        if: steps.validate.outputs.need == '1'
        uses: actions/cache/save@v5
        with:
          path: engine/prusa30/jniImports/tbb
          key: prusa30-tbb-v2021.12.0-${{ hashFiles('scripts/build_prusa30_tbb.sh') }}-ndk${{ env.NDK_VERSION }}-${{ env.ABI }}

  build-nlopt:
    name: nlopt
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Restore staged NLopt v2.5.0 from cache
        id: nlopt-cache
        uses: actions/cache/restore@v5
        with:
          path: engine/prusa30/jniImports/nlopt
          key: prusa30-nlopt-v2.5.0-${{ hashFiles('scripts/build_prusa30_nlopt.sh') }}-ndk${{ env.NDK_VERSION }}-${{ env.ABI }}

      - name: Validate restored NLopt
        id: validate
        run: |
          NEED=1
          if [ "${{ steps.nlopt-cache.outputs.cache-hit }}" = "true" ]; then
            OK=1
            test -f engine/prusa30/jniImports/nlopt/include/nlopt.hpp || OK=0
            ls engine/prusa30/jniImports/nlopt/lib/libnlopt_cxx.* >/dev/null 2>&1 || OK=0
            [ "$OK" = "1" ] && NEED=0
          fi
          echo "need=$NEED" >> "$GITHUB_OUTPUT"

      - name: Set up Android SDK env
        if: steps.validate.outputs.need == '1'
        uses: 1337farm/actions/setup-android-env@v1
      - name: Install NDK ${{ env.NDK_VERSION }}
        if: steps.validate.outputs.need == '1'
        uses: 1337farm/actions/setup-android-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
      - name: Install Android platform / CMake
        if: steps.validate.outputs.need == '1'
        run: |
          sdkmanager "platforms;android-37.0" "cmake;3.22.1"
          ln -sfn "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37"

      - name: Build NLopt v2.5.0 from source (static)
        if: steps.validate.outputs.need == '1'
        run: |
          chmod +x scripts/build_prusa30_nlopt.sh
          ABI="$ABI" API_LEVEL="23" \
            STAGE_ROOT="$(pwd)/engine/prusa30/jniImports/nlopt" \
            ./scripts/build_prusa30_nlopt.sh

      - name: Verify staged NLopt exactly
        if: steps.validate.outputs.need == '1'
        run: |
          test -f engine/prusa30/jniImports/nlopt/include/nlopt.hpp \
            || { echo "ERROR: nlopt.hpp missing"; exit 1; }
          ls engine/prusa30/jniImports/nlopt/lib/libnlopt_cxx.* >/dev/null \
            || { echo "ERROR: no libnlopt_cxx staged"; exit 1; }
          echo "NLopt v2.5.0 staged and verified"

      - name: Save staged NLopt v2.5.0
        if: steps.validate.outputs.need == '1'
        uses: actions/cache/save@v5
        with:
          path: engine/prusa30/jniImports/nlopt
          key: prusa30-nlopt-v2.5.0-${{ hashFiles('scripts/build_prusa30_nlopt.sh') }}-ndk${{ env.NDK_VERSION }}-${{ env.ABI }}

  build-expat:
    name: expat
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Restore staged expat R_2_8_2 from cache
        id: expat-cache
        uses: actions/cache/restore@v5
        with:
          path: engine/prusa30/jniImports/expat
          key: prusa30-expat-R_2_8_2-${{ hashFiles('scripts/build_prusa30_expat.sh') }}-ndk${{ env.NDK_VERSION }}-${{ env.ABI }}

      - name: Validate restored expat
        id: validate
        run: |
          NEED=1
          if [ "${{ steps.expat-cache.outputs.cache-hit }}" = "true" ]; then
            OK=1
            test -f engine/prusa30/jniImports/expat/include/expat.h || OK=0
            find engine/prusa30/jniImports/expat -name 'libexpat.a' | grep -q . || OK=0
            find engine/prusa30/jniImports/expat -name 'expat-config.cmake' | grep -q . || OK=0
            [ "$OK" = "1" ] && NEED=0
          fi
          echo "need=$NEED" >> "$GITHUB_OUTPUT"

      - name: Set up Android SDK env
        if: steps.validate.outputs.need == '1'
        uses: 1337farm/actions/setup-android-env@v1
      - name: Install NDK ${{ env.NDK_VERSION }}
        if: steps.validate.outputs.need == '1'
        uses: 1337farm/actions/setup-android-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
      - name: Install Android platform / CMake
        if: steps.validate.outputs.need == '1'
        run: |
          sdkmanager "platforms;android-37.0" "cmake;3.22.1"
          ln -sfn "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37"

      - name: Build expat R_2_8_2 from source (static)
        if: steps.validate.outputs.need == '1'
        run: |
          chmod +x scripts/build_prusa30_expat.sh
          ABI="$ABI" API_LEVEL="23" \
            STAGE_ROOT="$(pwd)/engine/prusa30/jniImports/expat" \
            ./scripts/build_prusa30_expat.sh

      - name: Verify staged expat exactly
        if: steps.validate.outputs.need == '1'
        run: |
          test -f engine/prusa30/jniImports/expat/include/expat.h \
            || { echo "ERROR: expat.h missing"; exit 1; }
          find engine/prusa30/jniImports/expat -name 'libexpat.a' | grep -q . \
            || { echo "ERROR: no libexpat.a staged"; exit 1; }
          find engine/prusa30/jniImports/expat -name 'expat-config.cmake' | grep -q . \
            || { echo "ERROR: expat-config.cmake missing"; exit 1; }
          echo "expat R_2_8_2 staged and verified"

      - name: Save staged expat R_2_8_2
        if: steps.validate.outputs.need == '1'
        uses: actions/cache/save@v5
        with:
          path: engine/prusa30/jniImports/expat
          key: prusa30-expat-R_2_8_2-${{ hashFiles('scripts/build_prusa30_expat.sh') }}-ndk${{ env.NDK_VERSION }}-${{ env.ABI }}

  build-pngfmt:
    name: pngfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Restore staged zlib+libpng from cache
        id: pf-cache
        uses: actions/cache/restore@v5
        with:
          path: engine/prusa30/jniImports/pngfmt
          key: prusa30-pngfmt-${{ hashFiles('scripts/build_prusa30_png.sh', 'scripts/build_prusa30_fmt.sh', 'scripts/build_prusa30_tracy.sh') }}-ndk${{ env.NDK_VERSION }}-${{ env.ABI }}

      - name: Validate restored pngfmt
        id: validate
        run: |
          NEED=1
          if [ "${{ steps.pf-cache.outputs.cache-hit }}" = "true" ]; then
            OK=1
            test -f engine/prusa30/jniImports/pngfmt/include/zlib.h || OK=0
            test -f engine/prusa30/jniImports/pngfmt/include/png.h || OK=0
            find engine/prusa30/jniImports/pngfmt -name 'libz.a' | grep -q . || OK=0
            find engine/prusa30/jniImports/pngfmt -name 'libpng*.a' | grep -q . || OK=0
            test -f engine/prusa30/jniImports/pngfmt/include/fmt/core.h || OK=0
            find engine/prusa30/jniImports/pngfmt -name 'libfmt.a' | grep -q . || OK=0
            find engine/prusa30/jniImports/pngfmt -name 'TracyClient.cpp' -o -name 'libTracyClient.a' | grep -q . || OK=0
            find engine/prusa30/jniImports/pngfmt -name 'TracyConfig.cmake' | grep -q . || OK=0
            [ "$OK" = "1" ] && NEED=0
          fi
          echo "need=$NEED" >> "$GITHUB_OUTPUT"

      - name: Set up Android SDK env
        if: steps.validate.outputs.need == '1'
        uses: 1337farm/actions/setup-android-env@v1
      - name: Install NDK ${{ env.NDK_VERSION }}
        if: steps.validate.outputs.need == '1'
        uses: 1337farm/actions/setup-android-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
      - name: Install Android platform / CMake
        if: steps.validate.outputs.need == '1'
        run: |
          sdkmanager "platforms;android-37.0" "cmake;3.22.1"
          ln -sfn "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37"

      - name: Build zlib+libpng+fmt+Tracy from source (static)
        if: steps.validate.outputs.need == '1'
        run: |
          chmod +x scripts/build_prusa30_png.sh scripts/build_prusa30_fmt.sh scripts/build_prusa30_tracy.sh
          PFX="$(pwd)/engine/prusa30/jniImports/pngfmt"
          ABI="$ABI" API_LEVEL="23" STAGE_ROOT="$PFX" ./scripts/build_prusa30_png.sh
          ABI="$ABI" API_LEVEL="23" STAGE_ROOT="$PFX" ./scripts/build_prusa30_fmt.sh
          ABI="$ABI" API_LEVEL="23" STAGE_ROOT="$PFX" NDK_ZLIB_ROOT="$PFX" ./scripts/build_prusa30_png.sh --libpng-only
          ABI="$ABI" API_LEVEL="23" STAGE_ROOT="$PFX" ./scripts/build_prusa30_tracy.sh

      - name: Verify staged pngfmt exactly
        if: steps.validate.outputs.need == '1'
        run: |
          test -f engine/prusa30/jniImports/pngfmt/include/zlib.h \
            || { echo "ERROR: zlib.h missing"; exit 1; }
          test -f engine/prusa30/jniImports/pngfmt/include/png.h \
            || { echo "ERROR: png.h missing"; exit 1; }
          find engine/prusa30/jniImports/pngfmt -name 'libz.a' | grep -q . \
            || { echo "ERROR: no libz.a staged"; exit 1; }
          find engine/prusa30/jniImports/pngfmt -name 'libpng*.a' | grep -q . \
            || { echo "ERROR: no libpng staged"; exit 1; }
          test -f engine/prusa30/jniImports/pngfmt/include/fmt/core.h \
            || { echo "ERROR: fmt/core.h missing"; exit 1; }
          find engine/prusa30/jniImports/pngfmt -name 'libfmt.a' | grep -q . \
            || { echo "ERROR: no libfmt.a staged"; exit 1; }
          find engine/prusa30/jniImports/pngfmt -name 'TracyClient.cpp' -o -name 'libTracyClient.a' | grep -q . \
            || { echo "ERROR: no TracyClient staged"; exit 1; }
          find engine/prusa30/jniImports/pngfmt -name 'TracyConfig.cmake' | grep -q . \
            || { echo "ERROR: no TracyConfig.cmake staged"; exit 1; }
          echo "pngfmt staged and verified"

      - name: Save staged zlib+libpng+fmt+Tracy
        if: steps.validate.outputs.need == '1'
        uses: actions/cache/save@v5
        with:
          path: engine/prusa30/jniImports/pngfmt
          key: prusa30-pngfmt-${{ hashFiles('scripts/build_prusa30_png.sh', 'scripts/build_prusa30_fmt.sh', 'scripts/build_prusa30_tracy.sh') }}-ndk${{ env.NDK_VERSION }}-${{ env.ABI }}

  build-assert:
    name: assert
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Restore staged libassert from cache
        id: assert-cache
        uses: actions/cache/restore@v5
        with:
          path: engine/prusa30/jniImports/assert
          key: prusa30-assert-${{ hashFiles('scripts/build_prusa30_libassert.sh') }}-ndk${{ env.NDK_VERSION }}-${{ env.ABI }}

      - name: Validate restored libassert
        id: validate
        run: |
          NEED=1
          if [ "${{ steps.assert-cache.outputs.cache-hit }}" = "true" ]; then
            OK=1
            find engine/prusa30/jniImports/assert -name 'libassert*.a' | grep -q . || OK=0
            find engine/prusa30/jniImports/assert -path '*/libassert/assert.hpp' | grep -q . || OK=0
            find engine/prusa30/jniImports/assert -name 'libassert-config.cmake' -o -name 'libassertConfig.cmake' | grep -q . || OK=0
            [ "$OK" = "1" ] && NEED=0
          fi
          echo "need=$NEED" >> "$GITHUB_OUTPUT"

      - name: Set up Android SDK env
        if: steps.validate.outputs.need == '1'
        uses: 1337farm/actions/setup-android-env@v1
      - name: Install NDK ${{ env.NDK_VERSION }}
        if: steps.validate.outputs.need == '1'
        uses: 1337farm/actions/setup-android-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
      - name: Install Android platform / CMake
        if: steps.validate.outputs.need == '1'
        run: |
          sdkmanager "platforms;android-37.0" "cmake;3.22.1"
          ln -sfn "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37"

      - name: Build cpptrace+libassert from source (static)
        if: steps.validate.outputs.need == '1'
        run: |
          chmod +x scripts/build_prusa30_libassert.sh
          ABI="$ABI" API_LEVEL="23" \
            STAGE_ROOT="$(pwd)/engine/prusa30/jniImports/assert" \
            ./scripts/build_prusa30_libassert.sh

      - name: Verify staged libassert exactly
        if: steps.validate.outputs.need == '1'
        run: |
          find engine/prusa30/jniImports/assert -name 'libassert*.a' | grep -q . \
            || { echo "ERROR: no libassert archive staged"; exit 1; }
          find engine/prusa30/jniImports/assert -path '*/libassert/assert.hpp' | grep -q . \
            || { echo "ERROR: libassert headers missing"; exit 1; }
          find engine/prusa30/jniImports/assert -name 'libassert-config.cmake' -o -name 'libassertConfig.cmake' | grep -q . \
            || { echo "ERROR: no libassert config staged"; exit 1; }
          echo "libassert v2.2.1 staged and verified"

      - name: Save staged libassert
        if: steps.validate.outputs.need == '1'
        uses: actions/cache/save@v5
        with:
          path: engine/prusa30/jniImports/assert
          key: prusa30-assert-${{ hashFiles('scripts/build_prusa30_libassert.sh') }}-ndk${{ env.NDK_VERSION }}-${{ env.ABI }}

  headless-build:
    name: headless
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    needs: [build-boost, build-tbb, build-nlopt, build-expat, build-pngfmt, build-assert]
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Android SDK env
        uses: 1337farm/actions/setup-android-env@v1
      - name: Install NDK ${{ env.NDK_VERSION }}
        uses: 1337farm/actions/setup-android-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
      - name: Install Android platform / CMake
        run: |
          sdkmanager "platforms;android-37.0" "cmake;3.22.1"
          ln -sfn "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37"

      - name: Fetch PrusaSlicer 3.0 source (pinned + patched)
        run: |
          chmod +x engine/prusa30/fetch_prusaslicer.sh
          PRUSA_REF="$PRUSA_REF" ./engine/prusa30/fetch_prusaslicer.sh

      - name: Stage header-only deps (cereal/json/spdlog/fmt/sol2/eigen)
        run: |
          chmod +x scripts/build_prusa30_deps.sh
          ./scripts/build_prusa30_deps.sh

      - name: Restore staged Boost ${{ env.BOOST_VER }} from cache
        id: boost-cache
        uses: actions/cache/restore@v5
        with:
          path: engine/prusa30/jniImports/boost
          key: prusa30-boost-${{ env.BOOST_VER }}-${{ hashFiles('scripts/build_boost.sh') }}-ndk${{ env.NDK_VERSION }}-${{ env.ABI }}
          fail-on-cache-miss: true

      - name: Validate staged Boost exactly
        run: |
          for lib in system filesystem thread regex chrono atomic date_time iostreams nowide; do
            ls "engine/prusa30/jniImports/boost/lib/$ABI/lib/libboost_${lib}"*.a >/dev/null \
              || { echo "ERROR: staged Boost missing libboost_$lib"; exit 1; }
          done
          grep -q "1_86" engine/prusa30/jniImports/boost/include/boost/version.hpp \
            || { echo "ERROR: staged Boost headers are not 1.86"; exit 1; }
          echo "--- actual staged archive names (FindBoost must match these) ---"
          ls engine/prusa30/jniImports/boost/lib/$ABI/lib/
          echo "Boost $BOOST_VER present and verified"

      - name: Bridge Boost archives into stage/lib (FindBoost search path)
        run: |
          # FindBoost probes <prefix>/stage/lib for BOOST_ROOT layouts; our
          # NDK archives live one level deeper (lib/<abi>/lib, Orca layout).
          # Relative symlinks keep working whatever the runner workspace is.
          mkdir -p engine/prusa30/jniImports/boost/stage/lib
          for a in engine/prusa30/jniImports/boost/lib/$ABI/lib/libboost_*.a; do
            ln -sf "../../lib/$ABI/lib/$(basename "$a")" \
              "engine/prusa30/jniImports/boost/stage/lib/$(basename "$a")"
          done
          ls engine/prusa30/jniImports/boost/stage/lib/ | head -5

      - name: Restore staged oneTBB v2021.12.0 from cache
        uses: actions/cache/restore@v5
        with:
          path: engine/prusa30/jniImports/tbb
          key: prusa30-tbb-v2021.12.0-${{ hashFiles('scripts/build_prusa30_tbb.sh') }}-ndk${{ env.NDK_VERSION }}-${{ env.ABI }}
          fail-on-cache-miss: true

      - name: Validate staged oneTBB exactly
        run: |
          test -f engine/prusa30/jniImports/tbb/include/oneapi/tbb/version.h \
            || { echo "ERROR: staged oneTBB missing oneapi headers"; exit 1; }
          find engine/prusa30/jniImports/tbb -name TBBConfig.cmake | grep -q . \
            || { echo "ERROR: staged oneTBB missing TBBConfig.cmake"; exit 1; }
          echo "oneTBB v2021.12.0 present and verified"

      - name: Restore staged NLopt v2.5.0 from cache
        uses: actions/cache/restore@v5
        with:
          path: engine/prusa30/jniImports/nlopt
          key: prusa30-nlopt-v2.5.0-${{ hashFiles('scripts/build_prusa30_nlopt.sh') }}-ndk${{ env.NDK_VERSION }}-${{ env.ABI }}
          fail-on-cache-miss: true

      - name: Validate staged NLopt exactly
        run: |
          test -f engine/prusa30/jniImports/nlopt/include/nlopt.hpp \
            || { echo "ERROR: staged NLopt missing nlopt.hpp"; exit 1; }
          ls engine/prusa30/jniImports/nlopt/lib/libnlopt_cxx.* >/dev/null \
            || { echo "ERROR: staged NLopt missing libnlopt_cxx"; exit 1; }
          echo "NLopt v2.5.0 present and verified"

      - name: Restore staged expat R_2_8_2 from cache
        uses: actions/cache/restore@v5
        with:
          path: engine/prusa30/jniImports/expat
          key: prusa30-expat-R_2_8_2-${{ hashFiles('scripts/build_prusa30_expat.sh') }}-ndk${{ env.NDK_VERSION }}-${{ env.ABI }}
          fail-on-cache-miss: true

      - name: Validate staged expat exactly
        run: |
          test -f engine/prusa30/jniImports/expat/include/expat.h \
            || { echo "ERROR: staged expat missing expat.h"; exit 1; }
          find engine/prusa30/jniImports/expat -name 'libexpat.a' | grep -q . \
            || { echo "ERROR: staged expat missing libexpat.a"; exit 1; }
          find engine/prusa30/jniImports/expat -name 'expat-config.cmake' | grep -q . \
            || { echo "ERROR: staged expat missing expat-config.cmake"; exit 1; }
          echo "expat R_2_8_2 present and verified"

      - name: Restore staged pngfmt from cache
        uses: actions/cache/restore@v5
        with:
          path: engine/prusa30/jniImports/pngfmt
          key: prusa30-pngfmt-${{ hashFiles('scripts/build_prusa30_png.sh', 'scripts/build_prusa30_fmt.sh', 'scripts/build_prusa30_tracy.sh') }}-ndk${{ env.NDK_VERSION }}-${{ env.ABI }}
          fail-on-cache-miss: true

      - name: Validate staged pngfmt exactly
        run: |
          test -f engine/prusa30/jniImports/pngfmt/include/zlib.h \
            || { echo "ERROR: staged zlib.h missing"; exit 1; }
          test -f engine/prusa30/jniImports/pngfmt/include/png.h \
            || { echo "ERROR: staged png.h missing"; exit 1; }
          find engine/prusa30/jniImports/pngfmt -name 'libz.a' | grep -q . \
            || { echo "ERROR: staged libz.a missing"; exit 1; }
          find engine/prusa30/jniImports/pngfmt -name 'libpng*.a' | grep -q . \
            || { echo "ERROR: staged libpng missing"; exit 1; }
          test -f engine/prusa30/jniImports/pngfmt/include/fmt/core.h \
            || { echo "ERROR: staged fmt/core.h missing"; exit 1; }
          find engine/prusa30/jniImports/pngfmt -name 'libfmt.a' | grep -q . \
            || { echo "ERROR: staged libfmt.a missing"; exit 1; }
          echo "pngfmt present and verified"

      - name: Restore staged libassert from cache
        uses: actions/cache/restore@v5
        with:
          path: engine/prusa30/jniImports/assert
          key: prusa30-assert-${{ hashFiles('scripts/build_prusa30_libassert.sh') }}-ndk${{ env.NDK_VERSION }}-${{ env.ABI }}
          fail-on-cache-miss: true

      - name: Validate staged libassert exactly
        run: |
          find engine/prusa30/jniImports/assert -name 'libassert*.a' | grep -q . \
            || { echo "ERROR: staged libassert missing archive"; exit 1; }
          find engine/prusa30/jniImports/assert -name 'libassert-config.cmake' -o -name 'libassertConfig.cmake' | grep -q . \
            || { echo "ERROR: staged libassert missing config"; exit 1; }
          echo "libassert v2.2.1 present and verified"

      - name: Configure headless 3.0 build (arm64-v8a)
        env:
          # Upstream FindNLopt reads the NLOPT *environment* variable:
          # $NLOPT/include/nlopt.hpp + $NLOPT/lib/libnlopt_cxx.
          NLOPT: ${{ github.workspace }}/engine/prusa30/jniImports/nlopt
        run: |
          # Configure upstream as the TOP-LEVEL project: its root CMakeLists
          # relies on CMAKE_SOURCE_DIR/module-path being the upstream tree.
          # TBB's config dir varies by install layout (lib/cmake/TBB vs
          # lib/<triplet>/cmake/TBB); resolve it instead of guessing.
          TBB_CMAKE_DIR="$(find "$(pwd)/engine/prusa30/jniImports/tbb" -name TBBConfig.cmake -printf '%h\n' | head -1)"
          test -n "$TBB_CMAKE_DIR" || { echo "ERROR: TBBConfig.cmake not staged"; exit 1; }
          echo "TBB config dir: $TBB_CMAKE_DIR"
          # Same for expat: its CONFIG file may sit at lib/cmake/expat or
          # lib/<triplet>/cmake/expat. Upstream FindEXPAT passes EXPAT_DIR
          # into find_package(EXPAT CONFIG), so give it the exact dir.
          EXPAT_CMAKE_DIR="$(find "$(pwd)/engine/prusa30/jniImports/expat" -name expat-config.cmake -printf '%h\n' | head -1)"
          test -n "$EXPAT_CMAKE_DIR" || { echo "ERROR: expat-config.cmake not staged"; exit 1; }
          echo "EXPAT config dir: $EXPAT_CMAKE_DIR"
          # Same for cereal: the staged tree carries a minimal CONFIG package
          # (the header-fallback bakes a source-relative include dir that
          # never resolves for staged headers).
          CEREAL_CMAKE_DIR="$(find "$(pwd)/engine/prusa30/jniImports/cereal" -name cereal-config.cmake -printf '%h\n' | head -1)"
          test -n "$CEREAL_CMAKE_DIR" || { echo "ERROR: cereal-config.cmake not staged"; exit 1; }
          echo "cereal config dir: $CEREAL_CMAKE_DIR"
          # Same for Eigen3: bundled find_package(Eigen3) is CONFIG-only.
          EIGEN_CMAKE_DIR="$(find "$(pwd)/engine/prusa30/jniImports/eigen" -name Eigen3Config.cmake -printf '%h\n' | head -1)"
          test -n "$EIGEN_CMAKE_DIR" || { echo "ERROR: Eigen3Config.cmake not staged"; exit 1; }
          echo "Eigen3 config dir: $EIGEN_CMAKE_DIR"
          # Same for tl-expected (slic3r-base links tl::expected).
          EXPECTED_CMAKE_DIR="$(find "$(pwd)/engine/prusa30/jniImports/expected" -name tl-expected-config.cmake -printf '%h\n' | head -1)"
          test -n "$EXPECTED_CMAKE_DIR" || { echo "ERROR: tl-expected-config.cmake not staged"; exit 1; }
          echo "tl-expected config dir: $EXPECTED_CMAKE_DIR"
          # Same for libassert: resolve whichever config name its install used.
          ASSERT_CMAKE_DIR="$(find "$(pwd)/engine/prusa30/jniImports/assert" \( -name libassert-config.cmake -o -name libassertConfig.cmake \) -printf '%h\n' | head -1)"
          test -n "$ASSERT_CMAKE_DIR" || { echo "ERROR: libassert config not staged"; exit 1; }
          echo "libassert config dir: $ASSERT_CMAKE_DIR"
          # libassert's config find_dependency()s cpptrace, which lives in
          # the same stage tree but off CMAKE_PREFIX_PATH — resolve it too.
          CPPTRACE_CMAKE_DIR="$(find "$(pwd)/engine/prusa30/jniImports/assert" -name cpptrace-config.cmake -printf '%h\n' | head -1)"
          test -n "$CPPTRACE_CMAKE_DIR" || { echo "ERROR: cpptrace-config.cmake not staged"; exit 1; }
          echo "cpptrace config dir: $CPPTRACE_CMAKE_DIR"
          # Same for fmt: fmt 12.x no longer ships a Find module, only
          # fmt-config.cmake — resolve it exactly the same way.
          FMT_CMAKE_DIR="$(find "$(pwd)/engine/prusa30/jniImports/pngfmt" -name fmt-config.cmake -printf '%h\n' | head -1)"
          test -n "$FMT_CMAKE_DIR" || { echo "ERROR: fmt-config.cmake not staged"; exit 1; }
          echo "fmt config dir: $FMT_CMAKE_DIR"
          # Same for spdlog (header-only shim exposing spdlog::spdlog).
          SPDLOG_CMAKE_DIR="$(find "$(pwd)/engine/prusa30/jniImports/spdlog" -name spdlogConfig.cmake -printf '%h\n' | head -1)"
          test -n "$SPDLOG_CMAKE_DIR" || { echo "ERROR: spdlogConfig.cmake not staged"; exit 1; }
          echo "spdlog config dir: $SPDLOG_CMAKE_DIR"
          # Tracy: slic3r_add_tracy needs target Tracy::TracyClient with an
          # INTERFACE_INCLUDE_DIRECTORIES property even when profiling is OFF
          # (sources only get compiled with SLIC3R_ENABLE_PROFILING=ON, off by
          # default). The staged TracyConfig.cmake provides exactly that
          # imported target; resolve its dir like the other CONFIG packages.
          TRACY_CMAKE_DIR="$(find "$(pwd)/engine/prusa30/jniImports/pngfmt" -name TracyConfig.cmake -printf '%h\n' | head -1)"
          test -n "$TRACY_CMAKE_DIR" || { echo "ERROR: TracyConfig.cmake not staged"; exit 1; }
          echo "Tracy config dir: $TRACY_CMAKE_DIR"
          # PNG/ZLIB: stock FindPNG/FindZLIB honor PNG_ROOT/ZLIB_ROOT, but
          # pre-seeding the exact lib+include paths is immune to GNUInstallDirs
          # nesting (lib/ vs lib/<triplet>/) and NDK-sysroot shadowing
          # (configure once grabbed sysroot libz.so 1.2.11 over staged 1.3.1).
          PNG_LIB="$(find "$(pwd)/engine/prusa30/jniImports/pngfmt" -name 'libpng16.a' -o -name 'libpng.a' | head -1)"
          test -n "$PNG_LIB" || { echo "ERROR: staged libpng not found"; exit 1; }
          PNG_INC="$(dirname "$(find "$(pwd)/engine/prusa30/jniImports/pngfmt" -name png.h | head -1)")"
          test -n "$PNG_INC" || { echo "ERROR: staged png.h not found"; exit 1; }
          echo "PNG lib: $PNG_LIB inc: $PNG_INC"
          ZLIB_LIB="$(find "$(pwd)/engine/prusa30/jniImports/pngfmt" -name 'libz.a' | head -1)"
          test -n "$ZLIB_LIB" || { echo "ERROR: staged libz.a not found"; exit 1; }
          ZLIB_INC="$(dirname "$(find "$(pwd)/engine/prusa30/jniImports/pngfmt" -name zlib.h | head -1)")"
          test -n "$ZLIB_INC" || { echo "ERROR: staged zlib.h not found"; exit 1; }
          echo "ZLIB lib: $ZLIB_LIB inc: $ZLIB_INC"
          cmake -S "$(pwd)/engine/build/prusaslicer-src" -B build/prusa30 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_STL=c++_shared \
            -DANDROID_PLATFORM=android-23 \
            -DCMAKE_BUILD_TYPE=Release \
            -DSLIC3R_GUI=OFF \
            -DSLIC3R_BUILD_TESTS=OFF \
            -DCMAKE_PREFIX_PATH="$(pwd)/engine/prusa30/jniImports" \
            -DBOOST_ROOT="$(pwd)/engine/prusa30/jniImports/boost" \
            -DBoost_INCLUDE_DIR="$(pwd)/engine/prusa30/jniImports/boost/include" \
            -DBoost_LIBRARY_DIR="$(pwd)/engine/prusa30/jniImports/boost/lib/arm64-v8a/lib" \
            -DBoost_ARCHITECTURE="-a64" \
            -DBoost_COMPILER="-clang" \
            -DTBB_DIR="$TBB_CMAKE_DIR" \
            -DEXPAT_DIR="$EXPAT_CMAKE_DIR" \
            -Dfmt_DIR="$FMT_CMAKE_DIR" \
            -Dlibassert_DIR="$ASSERT_CMAKE_DIR" \
            -Dcpptrace_DIR="$CPPTRACE_CMAKE_DIR" \
            -Dspdlog_DIR="$SPDLOG_CMAKE_DIR" \
            -Dcereal_DIR="$CEREAL_CMAKE_DIR" \
            -DEigen3_DIR="$EIGEN_CMAKE_DIR" \
            -Dtl-expected_DIR="$EXPECTED_CMAKE_DIR" \
            -DZLIB_ROOT="$(pwd)/engine/prusa30/jniImports/pngfmt" \
            -DPNG_ROOT="$(pwd)/engine/prusa30/jniImports/pngfmt" \
            -DZLIB_LIBRARY="$ZLIB_LIB" \
            -DZLIB_INCLUDE_DIR="$ZLIB_INC" \
            -DPNG_LIBRARY="$PNG_LIB" \
            -DPNG_PNG_INCLUDE_DIR="$PNG_INC" \
            -DTracy_DIR="$TRACY_CMAKE_DIR"

      - name: Build headless core (libslic3r)
        run: |
          cmake --build build/prusa30 --target libslic3r -j"$(nproc)"