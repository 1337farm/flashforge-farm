// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.20'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        // Shared P2P engine AAR (com.example.irohapp:irohbridge) published to
        // GitHub Packages from 1337farm/iroh-android-native on engine-v* tags.
        // GitHub Packages requires credentials even for public Maven packages:
        // GH_PACKAGES_USER / GH_PACKAGES_TOKEN (PAT with read:packages) are set
        // in CI via repo secrets and locally via env/gradle.properties.
        maven {
            name = "GitHubPackages"
            url = 'https://maven.pkg.github.com/1337farm/iroh-android-native'
            def user = System.getenv('GH_PACKAGES_USER') ?: project.findProperty('ghPackagesUser')
            def token = System.getenv('GH_PACKAGES_TOKEN') ?: project.findProperty('ghPackagesToken')
            if (user && token) {
                credentials {
                    username user
                    password token
                }
            } else {
                println "WARN: GH_PACKAGES_USER/GH_PACKAGES_TOKEN not set; resolving irohbridge may fail"
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}