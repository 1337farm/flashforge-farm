plugins {
    id 'com.android.application'
    // NOTE: no explicit Kotlin plugin. AGP 9 enables built-in Kotlin, which
    // pre-registers the 'kotlin' extension; applying kotlin-android as well
    // fails with "Cannot add extension with name 'kotlin'". The KGP version
    // stays pinned via the root buildscript classpath (AGP auto-upgrades it
    // to its required minimum). Kotlin sources live under src/main/kotlin.
}

def commit = getGitCommitHash(file('.'))
// The native libslic3r.so is ALWAYS built from source (see the CI workflow).
// skipNativeRebuild is for LOCAL incremental builds only: it skips
// recompiling the thin libfarm.so JNI bridge when intermediates already exist
// in app/build. It must never be used on a fresh checkout (e.g. CI runners),
// where skipping produces an APK without libfarm.so / libc++_shared.so.
// CI package-apk always runs a full assemble so the bridge is compiled.
def skipNativeRebuild = project.findProperty('skipNativeRebuild') == 'true'

android {
    namespace 'com.flashforge.farm'
    compileSdk 37

    defaultConfig {
        applicationId "com.flashforge.farm"
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName "0.4.6"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testOptions {
            unitTests.returnDefaultValues = true
        }
        manifestPlaceholders = [fileProviderAuthority: "${applicationId}.provider"]

        if (!skipNativeRebuild) {
            externalNativeBuild {
                cmake {
                    arguments '-DANDROID_STL=c++_shared', '-DANDROID_PLATFORM=23',
                            '-DCMAKE_BUILD_TYPE=Release', // Disabling this results in drastically degradation of slicing times on debug builds
                            "-DSLIC3R_VERSION=\"${defaultConfig.versionName}\"",
                            "-DSLIC3R_BUILD_ID=\"${defaultConfig.versionCode}\""
                }
            }
        }
    }
    sourceSets {
        main {
            // Native .so files live under the top-level engine/ folder,
            // cleanly separated from the Android app:
            //   engine/output/<ABI>/libslic3r.so      (engine build output; OCCT
            //                                          is statically linked INTO
            //                                          this .so — see the static
            //                                          OCCT + --gc-sections work)
            //   engine/src/main/jniLibs/<ABI>/         (GMP/MPFR shared libs)
            // There are NO libTK*.so runtime libs anymore: the OCCT toolkits
            // (previously engine/output/occt-libs, ~42MB) are archive inputs to
            // the engine link and never ship in the APK.
            jniLibs.srcDirs += [
                file('../engine/output'),
                file('../engine/src/main/jniLibs'),
            ]
        }
    }

    packaging {
        resources {
            excludes += [
                'win32-*/**',
                'darwin-*/**',
                'linux-*/**',
                '**/*.dll',
                '**/*.dylib',
                'DebugProbesKt.bin',
            ]
        }
        jniLibs {
            // Native libs ship UNCOMPRESSED by default (fast mmap loads, big
            // APK: libslic3r.so alone is ~65MB stored). useLegacyPackaging
            // has INVERTED naming: true = COMPRESSED (DEFLATE) libs, which is
            // what shrinks a sideloaded debug APK (~3x on libslic3r.so).
            // Trade-offs per official docs: slower loads, larger on-device
            // install size. Correct for direct-download distribution (no Play
            // patch-size benefit to protect).
            useLegacyPackaging = true
        }
    }

    signingConfigs {
        // Deterministic sideload signing. A per-build auto-generated
        // debug.keystore would give every CI build a DIFFERENT random cert
        // (fresh runners), so installing the next rolling APK over the previous
        // one fails with INSTALL_FAILED_UPDATE_INCOMPATIBLE ("package conflicts
        // with an existing package"). The committed keystore below signs every
        // CI AND local build with the same cert, so rolling releases update
        // in place. It is a self-hosted sideload key, not a Play key.
        def ks = new Properties()
        def ksf = file('../keystore.properties')
        if (ksf.exists()) {
            ksf.withInputStream { ks.load(it) }
            farm {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.farm
            buildConfigField "boolean", "IS_GOOGLE_PLAY", "false"
            buildConfigField "String", "COMMIT", "\"" + commit + "\""
            ndk {
                //noinspection ChromeOsAbiSupport
                abiFilters "arm64-v8a"
            }
        }
        debug {
            buildConfigField "boolean", "IS_GOOGLE_PLAY", "false"
            buildConfigField "String", "COMMIT", "\"" + commit + "\""
            signingConfig signingConfigs.farm
            ndk {
                debugSymbolLevel 'NONE'
                //noinspection ChromeOsAbiSupport
                abiFilters "arm64-v8a"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    ndkVersion "23.1.7779620"

    if (!skipNativeRebuild) {
        externalNativeBuild {
            cmake {
                path file('CMakeLists.txt')
            }
        }
    }

    buildFeatures {
        buildConfig true
    }
}

// NOTE: AGP 9 removed the applicationVariants DSL (MissingPropertyException).
// APK naming + downloads copy now live in the plain copyApkToDownloads task
// below (stable Gradle task names only), wired via finalizedBy.

def copyApkToDownloads = tasks.register('copyApkToDownloads') {
    def downloadsRoot = file(System.getenv('HOME') + '/storage/downloads')
    def downloadsDir = file(downloadsRoot.path + '/FlashForgeFarm-Debug-APK')
    def requiredSo = ['libslic3r.so', 'libfarm.so', 'libc++_shared.so', 'libgmp.so', 'libgmpxx.so', 'libmpfr.so']
    doLast {
        def outDir = file("$buildDir/outputs/apk/debug")
        fileTree(outDir) { include 'app-*.apk' }.files.each { f ->
            def target = new File(outDir, "FlashForgeFarm_debug_" + commit + ".apk")
            if (!f.canonicalPath.equals(target.canonicalPath)) {
                f.renameTo(target)
            }
        }
        if (!downloadsRoot.isDirectory()) {
            logger.warn("Downloads root not found at ${downloadsRoot}; skipping APK copy (run termux-setup-storage)")
            return
        }
        def apks = fileTree(outDir) { include 'FlashForgeFarm_*.apk' }.files
        if (apks.isEmpty()) {
            logger.warn("No APK found in ${buildDir}/outputs/apk/debug")
            return
        }
        apks.each { apk ->
            def zip = new java.util.zip.ZipFile(apk)
            try {
                def names = Collections.list(zip.entries()).collect { it.isDirectory() ? null : it.name }.findAll { it != null }
                def missing = requiredSo.findAll { !names.contains("lib/arm64-v8a/$it") }
                if (!missing.isEmpty()) {
                    throw new GradleException(
                            "Refusing to copy incomplete APK ${apk.name}: missing ${missing} in lib/arm64-v8a. " +
                            "Build with staged native deps (scripts/ensure-apk.sh) or ship libslic3r.so.")
                }
            } finally {
                zip.close()
            }
            copy {
                from apk
                into downloadsDir
            }
            println "Copied ${apk.name} -> ${downloadsDir}"
        }
    }
}
// Assemble tasks are registered lazily by AGP (after project evaluation),
// so the wiring must live in afterEvaluate, not at configuration time.
afterEvaluate {
    tasks.named('assembleDebug') { finalizedBy copyApkToDownloads }
    tasks.named('assembleRelease') { finalizedBy copyApkToDownloads }
}

static String getGitCommitHash(File dir) {
    try {
        return Runtime.getRuntime().exec("git rev-parse HEAD", null, dir).inputStream.readLines().get(0).substring(0, 10)
    } catch (Exception e){
        println("Unable to get git commit hash:")
        e.printStackTrace()
        return "non-git build"
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    implementation 'com.google.code.gson:gson:2.14.0'
    // P2P model registry transport: shared iroh-android-native engine AAR
    // (com.example.irohapp.IrohBridge over JNI). Published to GitHub Packages
    // by 1337farm/iroh-android-native; pinned to a stable engine-v* version.
    implementation 'com.example.irohapp:irohbridge:0.3.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1'
    // P2P identity: pure-Java Ed25519 (minSdk-safe; JDK/Android lack it).
    // Bloxbean fork (0.3.1): maintained patch line of eddsa-java with
    // verification fixes over the dormant 0.3.0.
    implementation 'com.bloxbean.cardano:net-i2p-crypto-eddsa:0.3.1'
    implementation 'com.github.instacart:truetime-android:4.0.0.alpha'
    implementation 'com.github.mrudultora:Colorpicker:1.2.0'
    implementation 'com.github.bumptech.glide:glide:5.0.9'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.loopj.android:android-async-http:1.4.11'
    implementation 'androidx.activity:activity:1.10.1'
    testImplementation 'junit:junit:4.13.2'
}
