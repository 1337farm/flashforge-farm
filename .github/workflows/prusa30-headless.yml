      - name: Set up Android SDK env
        if: steps.validate.outputs.need == '1'
        uses: 1337farm/actions/setup-android-env@v1
      - name: Install NDK ${{ env.NDK_VERSION }}
        if: steps.validate.outputs.need == '1'
        uses: 1337farm/actions/setup-android-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
      - name: Install Android platform / CMake
        if: steps.validate.outputs.need == '1'
        run: |
          sdkmanager "platforms;android-37.0" "cmake;3.22.1"
          ln -sfn "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37"

      - name: Build GMP+MPFR+CGAL from source (shared+static)
        if: steps.validate.outputs.need == '1'
        run: |
          chmod +x scripts/build_prusa30_gmp.sh
          ABI="$ABI" API_LEVEL="23" \
            STAGE_ROOT="$(pwd)/engine/prusa30/jniImports/gmpcgal" \
            BOOST_STAGE="$(pwd)/engine/prusa30/jniImports/boost" \
            ./scripts/build_prusa30_gmp.sh

      - name: Verify staged GMP+MPFR+CGAL exactly
        if: steps.validate.outputs.need == '1'
        run: |
          test -f engine/prusa30/jniImports/gmpcgal/include/gmp.h \
            || { echo "ERROR: gmp.h missing"; exit 1; }
          test -f engine/prusa30/jniImports/gmpcgal/include/gmpxx.h \
            || { echo "ERROR: gmpxx.h missing"; exit 1; }
          test -f engine/prusa30/jniImports/gmpcgal/include/mpfr.h \
            || { echo "ERROR: mpfr.h missing"; exit 1; }
          ls engine/prusa30/jniImports/gmpcgal/lib/libgmp.so >/dev/null \
            || { echo "ERROR: no libgmp.so staged"; exit 1; }
          ls engine/prusa30/jniImports/gmpcgal/lib/libgmpxx.so >/dev/null \
            || { echo "ERROR: no libgmpxx.so staged"; exit 1; }
          ls engine/prusa30/jniImports/gmpcgal/lib/libmpfr.so >/dev/null \
            || { echo "ERROR: no libmpfr.so staged"; exit 1; }
          find engine/prusa30/jniImports/gmpcgal \( -name 'CGALConfig.cmake' -o -name 'CGAL-config.cmake' \) | grep -q . \
            || { echo "ERROR: no CGAL config staged"; exit 1; }
          echo "GMP 6.2.1 + MPFR 4.2.0 + CGAL 5.6.2 staged and verified"

      - name: Save staged GMP+MPFR+CGAL
