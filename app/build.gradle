plugins {
    id 'com.android.application'
    // NOTE: no explicit Kotlin plugin. AGP 9 enables built-in Kotlin, which
    // pre-registers the 'kotlin' extension; applying kotlin-android as well
    // fails with "Cannot add extension with name 'kotlin'". The KGP version
    // stays pinned via the root buildscript classpath (AGP auto-upgrades it
    // to its required minimum). Kotlin sources live under src/main/kotlin.
}

def commit = getGitCommitHash(file('.'))
// The native libslic3r.so is ALWAYS built from source (see the CI workflow).
// This switch only skips a redundant recompile when `package-apk` repackages a
// .so already produced by the build-engine job. It must never point at a
// vendored prebuilt binary.
def skipNativeRebuild = project.findProperty('skipNativeRebuild') == 'true'

android {
    namespace 'com.flashforge.farm'
    compileSdk 37

    defaultConfig {
        applicationId "com.flashforge.farm"
        minSdk 21
        targetSdk 35
        versionCode 4
        versionName "0.4.6"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testOptions {
            unitTests.returnDefaultValues = true
        }
        manifestPlaceholders = [fileProviderAuthority: "${applicationId}.provider"]

        if (!skipNativeRebuild) {
            externalNativeBuild {
                cmake {
                    arguments '-DANDROID_STL=c++_shared', '-DANDROID_PLATFORM=21',
                            '-DCMAKE_BUILD_TYPE=Release', // Disabling this results in drastically degradation of slicing times on debug builds
                            "-DSLIC3R_VERSION=\"${defaultConfig.versionName}\"",
                            "-DSLIC3R_BUILD_ID=\"${defaultConfig.versionCode}\""
                }
            }
        }
    }
    sourceSets {
        main {
            // Native .so files live under the top-level engine/ folder,
            // cleanly separated from the Android app:
            //   engine/output/<ABI>/libslic3r.so      (engine build output)
            //   engine/src/main/occt/jniLibs/<ABI>/    (OCCT shared libs)
            //   engine/src/main/jniLibs/<ABI>/         (GMP/MPFR shared libs)
            jniLibs.srcDirs += [
                file('../engine/output'),
                file('../engine/src/main/occt/jniLibs'),
                file('../engine/src/main/jniLibs'),
            ]
        }
    }

    signingConfigs {
        // Sideloadable release signing using the well-known Android debug
        // keystore (auto-generated by the SDK at ~/.android/debug.keystore).
        // This avoids a private signing key while producing an installable APK.
        release {
            storeFile file(new File(System.getenv('HOME'), '.android/debug.keystore'))
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            buildConfigField "boolean", "IS_GOOGLE_PLAY", "false"
            buildConfigField "String", "COMMIT", "\"" + commit + "\""
            ndk {
                //noinspection ChromeOsAbiSupport
                abiFilters "arm64-v8a"
            }
        }
        debug {
            buildConfigField "boolean", "IS_GOOGLE_PLAY", "false"
            buildConfigField "String", "COMMIT", "\"" + commit + "\""
            ndk {
                debugSymbolLevel 'NONE'
                //noinspection ChromeOsAbiSupport
                abiFilters "arm64-v8a"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    ndkVersion "23.1.7779620"

    if (!skipNativeRebuild) {
        externalNativeBuild {
            cmake {
                path file('CMakeLists.txt')
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "FlashForgeFarm_${variant.buildType.name}_" + commit + ".apk"
        }
        tasks.named("assemble${variant.name.capitalize()}") { finalizedBy copyApkToDownloads }
    }
}

def copyApkToDownloads = tasks.register('copyApkToDownloads') {
    def downloadsRoot = file(System.getenv('HOME') + '/storage/downloads')
    def downloadsDir = file(downloadsRoot.path + '/FlashForgeFarm-Debug-APK')
    def requiredSo = ['libslic3r.so', 'libfarm.so', 'libc++_shared.so', 'libgmp.so', 'libgmpxx.so', 'libmpfr.so']
    doLast {
        if (!downloadsRoot.isDirectory()) {
            logger.warn("Downloads root not found at ${downloadsRoot}; skipping APK copy (run termux-setup-storage)")
            return
        }
        def apks = fileTree("$buildDir/outputs/apk/debug") { include '*.apk' }.files
        if (apks.isEmpty()) {
            logger.warn("No APK found in ${buildDir}/outputs/apk/debug")
            return
        }
        apks.each { apk ->
            def zip = new java.util.zip.ZipFile(apk)
            try {
                def names = Collections.list(zip.entries()).collect { it.isDirectory() ? null : it.name }.findAll { it != null }
                def missing = requiredSo.findAll { !names.contains("lib/arm64-v8a/$it") }
                if (!missing.isEmpty()) {
                    throw new GradleException(
                            "Refusing to copy incomplete APK ${apk.name}: missing ${missing} in lib/arm64-v8a. " +
                            "Build with staged native deps (scripts/ensure-apk.sh) or ship libslic3r.so.")
                }
            } finally {
                zip.close()
            }
            copy {
                from apk
                into downloadsDir
            }
            println "Copied ${apk.name} -> ${downloadsDir}"
        }
    }
}

static String getGitCommitHash(File dir) {
    try {
        return Runtime.getRuntime().exec("git rev-parse HEAD", null, dir).inputStream.readLines().get(0).substring(0, 10)
    } catch (Exception e){
        println("Unable to get git commit hash:")
        e.printStackTrace()
        return "non-git build"
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    implementation 'com.google.code.gson:gson:2.14.0'
    // Iroh P2P (spike): official Kotlin FFI, Maven Central artifact bundles
    // libiroh_ffi.so for all Android ABIs. The artifact's transitive plain-jar
    // JNA conflicts with Android packaging, so exclude it and depend on the
    // @aar variant (which carries libjnidispatch.so per ABI) instead.
    implementation('computer.iroh:iroh:1.0.0') {
        exclude group: 'net.java.dev.jna', module: 'jna'
    }
    implementation 'net.java.dev.jna:jna:5.17.0@aar'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1'
    implementation 'com.github.instacart:truetime-android:4.0.0.alpha'
    implementation 'com.github.mrudultora:Colorpicker:1.2.0'
    implementation 'com.github.bumptech.glide:glide:5.0.9'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.loopj.android:android-async-http:1.4.11'
    implementation 'androidx.activity:activity:1.10.1'
    testImplementation 'junit:junit:4.13.2'
}
