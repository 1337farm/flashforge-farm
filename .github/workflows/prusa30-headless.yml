            OK=1
            test -f engine/prusa30/jniImports/openvdb/include/openvdb/version.h || OK=0
            find engine/prusa30/jniImports/openvdb -name 'libopenvdb.a' | grep -q . || OK=0
            grep -q "OPENVDB_USE_BLOSC" engine/prusa30/jniImports/openvdb/include/openvdb/version.h 2>/dev/null || OK=0
            [ "$OK" = "1" ] && NEED=0
